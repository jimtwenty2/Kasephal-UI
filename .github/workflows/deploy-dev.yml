name: Dev Deploy - Frontend

on:
  push:
    branches:
      - develop
      - feature/github-workflows

permissions:
  contents: read
  packages: write

concurrency:
  group: dev-deploy-frontend
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: self-hosted
    timeout-minutes: 15
    environment: DEV_ENV

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --force

      # - name: Lint application
      #   run: npm run lint

      - name: Build application
        env:
          NEXT_BASE_API_URL: ${{ vars.NEXT_BASE_API_URL }}
          NEXT_PUBLIC_BASE_API_URL: ${{ vars.NEXT_PUBLIC_BASE_API_URL }}
          NEXT_PUBLIC_IMAGE_BASE_URL: ${{ vars.NEXT_PUBLIC_IMAGE_BASE_URL }}
          NEXT_PUBLIC_BASE_WS_URL: ${{ vars.NEXT_PUBLIC_BASE_WS_URL }}
          IMAGE_BASE_URL: ${{ vars.IMAGE_BASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: npm run build

      - name: Telegram Build/Test Failure Notification
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ vars.TELEGRAM_MESSAGE_THREAD_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)

          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode message_thread_id="${TELEGRAM_MESSAGE_THREAD_ID}" \
            --data-urlencode parse_mode="HTML" \
            --data-urlencode text="
            ❌ <b>Frontend Build Failed</b>

            Repository: <b>${GITHUB_REPOSITORY}</b>
            Branch: <b>${GITHUB_REF_NAME}</b>
            Actor: <b>${GITHUB_ACTOR}</b>

            Commit:
            <code>${SHORT_SHA}</code>

            Message:
            <code>${COMMIT_MESSAGE}</code>

            <a href='https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}'>
            View Workflow Run
            </a>
            "

  docker-build-push:
    runs-on: self-hosted
    timeout-minutes: 30
    needs: build-test
    environment: DEV_ENV

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/sora121367/kasephal-frontend:dev
            ghcr.io/sora121367/kasephal-frontend:${{ github.sha }}
          build-args: |
            NEXT_BASE_API_URL=${{ vars.NEXT_BASE_API_URL }}
            NEXT_PUBLIC_BASE_API_URL=${{ vars.NEXT_PUBLIC_BASE_API_URL }}
            IMAGE_BASE_URL=${{ vars.IMAGE_BASE_URL }}
            NEXT_PUBLIC_IMAGE_BASE_URL=${{ vars.NEXT_PUBLIC_IMAGE_BASE_URL }}
            NEXT_PUBLIC_BASE_WS_URL=${{ vars.NEXT_PUBLIC_BASE_WS_URL }}
            AUTH_URL=${{ vars.AUTH_URL }}
            AUTH_TRUST_HOST=true
          # BETTER_AUTH_SECRET is intentionally NOT passed as a build arg; it is
          # injected at runtime through the container environment (docker-compose.dev.yml).
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Telegram Docker Failure Notification
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ vars.TELEGRAM_MESSAGE_THREAD_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)

          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode message_thread_id="${TELEGRAM_MESSAGE_THREAD_ID}" \
            --data-urlencode parse_mode="HTML" \
            --data-urlencode text="
            🐳 <b>Frontend Docker Build Failed</b>

            Repository: <b>${GITHUB_REPOSITORY}</b>
            Branch: <b>${GITHUB_REF_NAME}</b>
            Actor: <b>${GITHUB_ACTOR}</b>

            Commit:
            <code>${SHORT_SHA}</code>

            Message:
            <code>${COMMIT_MESSAGE}</code>

            <a href='https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}'>
            View Workflow Run
            </a>
            "
  deploy:
    runs-on: self-hosted
    timeout-minutes: 20
    needs: docker-build-push
    environment: DEV_ENV

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Copy docker-compose.dev.yml to VPS
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.dev.yml"
          target: "/opt/app/dev-kasephal-frontend"

      - name: Deploy application via SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            APP_DIR=/opt/app/dev-kasephal-frontend

            mkdir -p $APP_DIR

            cd $APP_DIR

            echo "Creating .env..."

            cat > .env <<EOF
            NODE_ENV=production
            NEXT_BASE_API_URL=${{ vars.NEXT_BASE_API_URL }}
            NEXT_PUBLIC_BASE_API_URL=${{ vars.NEXT_PUBLIC_BASE_API_URL }}
            IMAGE_BASE_URL=${{ vars.IMAGE_BASE_URL }}
            NEXT_PUBLIC_IMAGE_BASE_URL=${{ vars.NEXT_PUBLIC_IMAGE_BASE_URL }}
            NEXT_PUBLIC_BASE_WS_URL=${{ vars.NEXT_PUBLIC_BASE_WS_URL }}
            BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
            AUTH_URL=${{ vars.AUTH_URL }}
            AUTH_TRUST_HOST=true
            PORT=3000
            EOF

            echo "Logging into GHCR..."

            echo "${{ secrets.GHCR_TOKEN }}" | \
              docker login ghcr.io \
              -u "${{ secrets.GHCR_USER }}" \
              --password-stdin

            echo "Pulling latest images..."

            docker compose -f docker-compose.dev.yml down

            docker compose -f docker-compose.dev.yml pull

            docker compose -f docker-compose.dev.yml up -d --remove-orphans

            echo "Cleaning unused images..."

            docker image prune -f

            echo "Waiting for frontend healthcheck..."

            for i in $(seq 1 30); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                http://localhost:3000 || true)

              if [ "$STATUS" = "200" ]; then
                echo "Frontend healthy"

                docker compose -f docker-compose.dev.yml ps

                exit 0
              fi

              echo "Attempt $i failed with status $STATUS"

              sleep 5
            done

            echo "Frontend failed healthcheck"

            docker compose -f docker-compose.dev.yml logs

            exit 1

      - name: Telegram Success Notification
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ vars.TELEGRAM_MESSAGE_THREAD_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)

          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode message_thread_id="${TELEGRAM_MESSAGE_THREAD_ID}" \
            --data-urlencode parse_mode="HTML" \
            --data-urlencode text="
            ✅ <b>Frontend Dev Deploy Successful</b>

            Repository: <b>${GITHUB_REPOSITORY}</b>
            Branch: <b>${GITHUB_REF_NAME}</b>
            Actor: <b>${GITHUB_ACTOR}</b>

            Commit:
            <code>${SHORT_SHA}</code>

            Message:
            <code>${COMMIT_MESSAGE}</code>

            <a href='https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}'>
            View Workflow Run
            </a>
            "

      - name: Telegram Deploy Failure Notification
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ vars.TELEGRAM_MESSAGE_THREAD_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)

          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode message_thread_id="${TELEGRAM_MESSAGE_THREAD_ID}" \
            --data-urlencode parse_mode="HTML" \
            --data-urlencode text="
            ❌ <b>Frontend Dev Deploy Failed</b>

            Repository: <b>${GITHUB_REPOSITORY}</b>
            Branch: <b>${GITHUB_REF_NAME}</b>
            Actor: <b>${GITHUB_ACTOR}</b>

            Commit:
            <code>${SHORT_SHA}</code>

            Message:
            <code>${COMMIT_MESSAGE}</code>

            Check logs immediately.

            <a href='https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}'>
            View Workflow Run
            </a>
            "

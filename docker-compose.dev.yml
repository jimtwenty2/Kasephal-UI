services:
  frontend:
    image: ghcr.io/sora121367/kasephal-frontend:dev
    container_name: kasephal-frontend-dev
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


